version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: syrka
      POSTGRES_PASSWORD: syrka_password
      POSTGRES_DB: syrka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/initial_schema.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://syrka:syrka_password@db:5432/syrka
      SECRET_KEY: change-this-secret-key-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
