services:
  # Main FastAPI Application
  - type: web
    name: syrka-api
    env: docker
    dockerfilePath: ./syrka/Dockerfile
    dockerContext: ./syrka
    plan: free
    region: oregon
    branch: claude/explain-codebase-mknby59x703omtn1-ShhHe
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: syrka-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: DEBUG
        value: false
      - key: OPENAI_API_KEY
        sync: false  # You'll need to add this manually
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-ada-002
      - key: HF_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: FAISS_INDEX_PATH
        value: /tmp/faiss_index
      - key: UPLOAD_DIR
        value: /tmp/uploads

databases:
  # PostgreSQL Database
  - name: syrka-db
    plan: free
    databaseName: syrka
    user: syrka_user
